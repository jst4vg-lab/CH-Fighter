name: Security and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install verified Gitleaks
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --output /tmp/gitleaks_checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd /tmp
          sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' gitleaks_checksums.txt | grep ' gitleaks.tar.gz$' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - run: python -m pip install pip==26.3 pip-audit==2.10.1
      - run: python -m pip install -r requirements-build.lock.txt
      - run: npm ci --ignore-scripts
      - run: python scripts/security_check.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build
