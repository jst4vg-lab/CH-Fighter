# Copy to $CH_DATA_DIR/communications-profiles.toml.
# Credentials belong in backend .env, never here.
[profiles.bot]
name = "Bot"
provider = "discord_bot"
token_env = "DISCORD_READ_BOT_TOKEN"
guild_id = "111111111111111111"
channel_id = "333333333333333333"
read_enabled = true
write_enabled = true

[profiles.user]
name = "User"
provider = "discord_user"
token_env = "DISCORD_USER_TOKEN"
guild_id = "111111111111111111"
channel_id = "333333333333333333"
read_enabled = true
write_enabled = true
